name: Run Trivy vulnerability scanner

on: [push]

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build docker image for test
        run: |
          docker build -t dim_eccodes_baseimage:test .

      - name: Run Trivy vulnerability scanner on dim_eccodes_baseimage:test
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
        with:
          image-ref: dim_eccodes_baseimage:test
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Diagnose Python packages on failure
        if: failure()
        run: |
          for python in /usr/bin/python3 /venv/bin/python; do
            echo "=== $python ==="
            docker run --rm --entrypoint "$python" \
              dim_eccodes_baseimage:test -c '
          import importlib.metadata as m
          import importlib.util

          for p in ("msgpack", "setuptools", "urllib3"):
              try:
                  version = m.version(p)
                  spec = importlib.util.find_spec(p)
                  path = spec.origin if spec else "unknown"
                  print("{}: {}; path={}".format(p, version, path))
              except m.PackageNotFoundError:
                  print("{}: not installed".format(p))
          '
          done
