name: Run Trivy vulnerability scanner

on: [push]

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build docker image for test
        run: |
          docker build -t dim_eccodes_baseimage:test .

      - name: Run Trivy vulnerability scanner on dim_eccodes_baseimage:test
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
        with:
          image-ref: dim_eccodes_baseimage:test
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          skip-files: '**/pip/_vendor/bom.cdx.json'
      - name: Export detailed Trivy report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
        with:
          image-ref: dim_eccodes_baseimage:test
          format: json
          output: trivy-report.json
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy report
        if: always() && hashFiles('trivy-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
